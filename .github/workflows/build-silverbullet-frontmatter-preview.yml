name: Build SilverBullet frontmatter preview

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SB_REF: "2.11.1"
  IMAGE_NAME: "silverbullet-frontmatter-preview"
  IMAGE_TAG: "2.11.1-test"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout SilverBullet 2.11.1
        uses: actions/checkout@v4
        with:
          repository: silverbulletmd/silverbullet
          ref: ${{ env.SB_REF }}
          path: silverbullet
          fetch-depth: 1

      - name: Apply frontmatter preview prototype
        run: |
          python3 tools/apply_frontmatter_preview.py silverbullet
          python3 tools/patch_frontmatter_tests.py silverbullet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: silverbullet/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silverbullet
          key: silverbullet-frontmatter-preview-amd64

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install npm dependencies
        working-directory: silverbullet
        run: npm ci

      - name: Generate SilverBullet version metadata
        working-directory: silverbullet
        run: npm run build:plugs

      - name: TypeScript check
        working-directory: silverbullet
        run: npm run check

      - name: Frontmatter folding tests
        working-directory: silverbullet
        run: npx vitest run client/codemirror/frontmatter_folding.test.ts

      - name: Build client and plugs
        working-directory: silverbullet
        run: npm run build

      - name: Build SilverBullet static amd64 binary
        working-directory: silverbullet
        run: |
          cargo build --release -p silverbullet --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/silverbullet silverbullet-amd64
          file silverbullet-amd64
          if file silverbullet-amd64 | grep -q "interpreter"; then
            echo "ERROR: binary is dynamically linked"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push experimental image
        uses: docker/build-push-action@v6
        with:
          context: silverbullet
          file: silverbullet/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:test
